<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#17191C">
<title>Price Scout — Lite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --paper:#FAF9F6; --card:#FFFFFF; --ink:#17191C; --mut:#6E6A61;
  --line:#E6E2D9; --tag:#FF7A1A; --tag-deep:#E05E00; --tag-ink:#3A1A00;
  --ok:#0E8A5F; --ok-bg:#EAF6F0; --warn:#C7462B; --amber:#B07100; --amber-bg:#FBF3E0;
  --r:14px; --shadow:0 1px 2px rgba(23,25,28,.06),0 6px 18px rgba(23,25,28,.07);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--paper); color:var(--ink);
  font-family:'Noto Sans Thai',system-ui,sans-serif; font-size:16px}
body{max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
button{font-family:inherit; border:none; cursor:pointer; background:none; color:inherit}
input{font-family:inherit}
header{position:sticky; top:0; z-index:20; background:var(--paper);
  border-bottom:1px solid var(--line); padding:10px 14px; display:flex; align-items:center; gap:10px}
.logo{font-weight:800; font-size:15px}
.logo small{display:block; font-weight:500; color:var(--mut); font-size:11px; letter-spacing:.4px}
.store-chip{margin-left:auto; display:flex; align-items:center; gap:7px; background:var(--ink);
  color:#fff; border-radius:99px; padding:8px 14px; font-weight:600; font-size:14px; max-width:55%; box-shadow:var(--shadow)}
.store-chip .dot{width:7px; height:7px; border-radius:99px; background:var(--tag); flex:none}
.store-chip span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.store-chip.empty{background:var(--warn)}
main{flex:1; padding:14px; display:flex; flex-direction:column; gap:12px; padding-bottom:80px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:14px}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:1px; color:var(--mut); text-transform:uppercase; margin-bottom:8px}
.tin{width:100%; padding:13px; font-size:16px; font-weight:600; border:1.5px solid var(--line);
  border-radius:11px; background:var(--paper)}
.tin:focus{outline:none; border-color:var(--ink)}
.recent-stores{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.recent-stores button{background:var(--paper); border:1px solid var(--line); border-radius:99px; padding:8px 14px; font-size:14px; font-weight:600}
.big-btn{width:100%; padding:15px; border-radius:12px; font-size:17px; font-weight:700; background:var(--ink); color:#fff; margin-top:14px}
.big-btn:disabled{opacity:.35}
.big-btn.tag{background:var(--tag); color:var(--tag-ink)}
.big-btn:active{transform:scale(.985)}
.code-row{display:flex; gap:8px}
.code-row input{flex:1; padding:13px 14px; font-size:18px; letter-spacing:1px; border:1.5px solid var(--line);
  border-radius:12px; background:var(--paper); min-width:0}
.code-row input:focus{outline:none; border-color:var(--ink)}
.scan-btn{flex:none; width:54px; border-radius:12px; background:var(--ink); color:#fff; font-size:22px; display:grid; place-items:center}
#reader{margin-top:10px; border-radius:12px; overflow:hidden; display:none}
.hit{border-left:5px solid var(--ok); background:var(--ok-bg); display:flex; gap:12px; align-items:center}
.hit img{width:64px; height:64px; object-fit:cover; border-radius:10px; background:#fff; border:1px solid var(--line); flex:none}
.hit .brand{font-size:12px; font-weight:700; color:var(--ok); letter-spacing:.5px; text-transform:uppercase}
.hit .name{font-size:16.5px; font-weight:700; line-height:1.25}
.hit .sku{font-size:13.5px; color:var(--mut); font-weight:600}
.miss{border-left:5px solid var(--amber); background:var(--amber-bg)}
.miss .headline{font-weight:700; color:var(--amber); font-size:15px; margin-bottom:8px}
.miss .tin{background:#fff; margin-top:8px; font-size:15px; padding:11px}
.chip-btn{padding:11px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-weight:600; font-size:14px}
.chip-btn.on{border-color:var(--ink); background:var(--ink); color:#fff}
.photo-thumb{margin-top:10px; display:flex; align-items:center; gap:10px}
.photo-thumb img{width:52px; height:52px; object-fit:cover; border-radius:8px; border:1px solid var(--line)}
.photo-thumb .rm{color:var(--warn); font-weight:700; font-size:13px}
.later-note{margin-top:8px; font-size:12.5px; color:var(--mut)}
.tag-wrap{display:flex; justify-content:center; padding:4px 0 2px}
.price-tag{position:relative; background:var(--tag); color:var(--tag-ink); border-radius:10px;
  padding:10px 26px 12px; min-width:190px; text-align:center; box-shadow:0 3px 0 var(--tag-deep), var(--shadow)}
.price-tag::before{content:""; position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:9px; height:9px; border-radius:99px; background:var(--paper); box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.price-tag .cur{font-size:14px; font-weight:700; vertical-align:top; margin-right:2px}
.price-tag .amt{font-family:'IBM Plex Mono',monospace; font-size:40px; font-weight:700; line-height:1}
.price-tag .amt.empty{opacity:.35}
.price-tag .lbl{font-size:10.5px; font-weight:700; letter-spacing:1.5px; opacity:.75; margin-top:2px}
.flags{display:flex; gap:8px; margin:10px 0 4px}
.flags .chip-btn{flex:1; font-size:13px; padding:9px 6px}
.flags .chip-btn.on.exp{background:var(--warn); border-color:var(--warn)}
.flags .chip-btn.on.promo{background:var(--amber); border-color:var(--amber)}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px}
.pad button{padding:15px 0; font-size:23px; font-weight:600; background:var(--paper); border:1px solid var(--line);
  border-radius:12px; font-family:'IBM Plex Mono',monospace}
.pad button:active{background:var(--line)}
.pad .fn{font-size:19px; color:var(--mut)}
#toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(20px); background:var(--ink);
  color:#fff; padding:11px 20px; border-radius:99px; font-weight:600; font-size:14px; opacity:0; pointer-events:none;
  transition:.25s; z-index:50; white-space:nowrap}
#toast.show{opacity:1; transform:translateX(-50%)}
#toast.err{background:var(--warn)}
footer{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  background:var(--card); border-top:1px solid var(--line); padding:9px 14px; z-index:30;
  display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--mut)}
footer b{color:var(--ink)}
.spin{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--tag); border-radius:99px;
  animation:sp 1s linear infinite; flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo">PRICE SCOUT <small>Lite — pipeline test</small></div>
  <button class="store-chip empty" id="storeChip" onclick="showStore()">
    <span class="dot"></span><span id="storeChipName">เลือกร้าน</span>
  </button>
</header>

<main>

  <section id="storeScreen" class="card">
    <div class="eyebrow">ร้านที่กำลังสำรวจ · Store</div>
    <input type="text" id="storeInput" class="tin" list="storeList" placeholder="พิมพ์ชื่อร้าน…" autocomplete="off">
    <datalist id="storeList"></datalist>
    <div class="recent-stores" id="recentStores"></div>
    <button class="big-btn" id="storeGo" onclick="setStore()" disabled>เริ่มเก็บราคา →</button>
  </section>

  <section id="captureScreen" class="hidden">

    <div class="card">
      <div class="eyebrow">บาร์โค้ด · Barcode</div>
      <div class="code-row">
        <input type="text" id="codeInput" inputmode="numeric" placeholder="สแกน หรือพิมพ์เลข…"
               autocomplete="off" onkeydown="if(event.key==='Enter')lookup()">
        <button class="scan-btn" id="camBtn" onclick="toggleCam()" title="เปิดกล้อง">▣</button>
      </div>
      <div id="reader"></div>
    </div>

    <div class="card hit hidden" id="hitCard">
      <img id="hitImg" alt="" onerror="this.style.visibility='hidden'">
      <div>
        <div class="brand" id="hitBrand"></div>
        <div class="name" id="hitItem"></div>
        <div class="sku" id="hitSku"></div>
      </div>
    </div>

    <div class="card miss hidden" id="missCard">
      <div class="headline">ไม่พบสินค้านี้ — สินค้าใหม่</div>
      <input type="text" id="newBrand" class="tin" placeholder="ยี่ห้อ (Brand)" list="brandList">
      <datalist id="brandList"></datalist>
      <input type="text" id="newItem" class="tin" placeholder="ชื่อสินค้า (Item)">
      <input type="text" id="newSku" class="tin" placeholder="สี/เฉด/รุ่น (SKU) — ถ้ามี">
      <div style="margin-top:10px"><button class="chip-btn" style="width:100%" onclick="photoInput.click()">📷 ถ่ายรูปสินค้า</button></div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden" onchange="gotPhoto(this)">
      <div class="photo-thumb hidden" id="photoThumb">
        <img id="photoImg" alt=""><button class="rm" onclick="clearPhoto()">ลบรูป</button>
      </div>
      <div class="later-note">ข้ามได้ทุกช่อง — จะติดธง "รอกรอกข้อมูล" ให้เติมทีหลังใน Sheet</div>
    </div>

    <div class="card hidden" id="priceCard">
      <div class="tag-wrap">
        <div class="price-tag">
          <span class="cur">฿</span><span class="amt empty" id="amt">0</span>
          <div class="lbl">ราคาขายปลีกที่เห็น</div>
        </div>
      </div>
      <div class="flags">
        <button class="chip-btn on" data-f="normal" onclick="setFlag(this)">ปกติ</button>
        <button class="chip-btn exp" data-f="short_shelf_life" onclick="setFlag(this)">ใกล้หมดอายุ</button>
        <button class="chip-btn promo" data-f="promo" onclick="setFlag(this)">โปรฯ</button>
      </div>
      <div class="pad">
        <button onclick="key('1')">1</button><button onclick="key('2')">2</button><button onclick="key('3')">3</button>
        <button onclick="key('4')">4</button><button onclick="key('5')">5</button><button onclick="key('6')">6</button>
        <button onclick="key('7')">7</button><button onclick="key('8')">8</button><button onclick="key('9')">9</button>
        <button class="fn" onclick="key('.')">·</button><button onclick="key('0')">0</button><button class="fn" onclick="key('⌫')">⌫</button>
      </div>
      <button class="big-btn tag" id="saveBtn" onclick="saveObs()" disabled>บันทึกราคา</button>
    </div>

  </section>
</main>

<footer>
  <div class="spin" id="loadSpin"></div>
  <div id="status">กำลังโหลดฐานข้อมูลสินค้า…</div>
  <div style="margin-left:auto" id="sessionCount"></div>
</footer>

<div id="toast"></div>

<script>
/* ================= CONFIG ================= */
const API_URL = "";   // ← วาง Web app URL จาก Apps Script ที่นี่
const DEVICE  = "";   // ← ชื่อคนใช้เครื่องนี้ เช่น "Ooa"

/* ================= STATE ================= */
const S = { store:null, storeId:null, newStore:null, products:{}, brands:new Set(),
  stores:[], recent:[], code:null, isNew:false, photo:null, price:"", flag:"normal",
  count:0, queue:[], cam:null, camOn:false, ready:false };
const $ = id => document.getElementById(id);
const ls = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
};
const uid = p => p + '-' + Array.from({length:6},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)]).join('');

/* ================= INIT ================= */
async function init(){
  S.recent = ls.get("ps_recent", []);
  S.queue  = ls.get("ps_queue", []);
  const cached = ls.get("ps_boot", null);
  if(cached){ applyBoot(cached); status(`ฐานข้อมูลพร้อม (${Object.keys(S.products).length.toLocaleString()} สินค้า · จากแคช)`, false); }
  if(!API_URL){
    if(!cached){
      applyBoot({cdn:"", p:[["8850123000011","MISTINE","Matte Lipstick","No.05",""],
                           ["8850123000028","ODBO","Blush 3 Colors","",""]],
                 s:[["S-DEMO01","EVEANDBOY"]]});
      status("โหมดทดลอง — ยังไม่เชื่อม API", false);
    }
    return;
  }
  try{
    status("กำลังโหลดฐานข้อมูลสินค้า…", true);
    const r = await fetch(API_URL + "?action=bootstrap");
    const d = await r.json();
    applyBoot(d);
    ls.set("ps_boot", d);
    status(`ฐานข้อมูลพร้อม · ${Object.keys(S.products).length.toLocaleString()} สินค้า`, false);
  }catch(e){
    status(cached ? "ออฟไลน์ — ใช้ฐานข้อมูลจากแคช" : "โหลดฐานข้อมูลไม่สำเร็จ — เช็ค API_URL", false);
  }
  flushQueue();
}
function applyBoot(d){
  S.products = {}; S.brands = new Set();
  (d.p||[]).forEach(r=>{
    S.products[r[0]] = { brand:r[1], item:r[2], sku:r[3], img: r[4] ? r[4].replace("~", d.cdn||"") : "" };
    if(r[1]) S.brands.add(r[1]);
  });
  S.stores = (d.s||[]).map(r=>({id:r[0], name:r[1]}));
  $("storeList").innerHTML = S.stores.map(s=>`<option value="${esc(s.name)}">`).join("");
  $("brandList").innerHTML = [...S.brands].sort().slice(0,4000).map(b=>`<option value="${esc(b)}">`).join("");
  renderRecent(); S.ready = true;
}
function renderRecent(){
  $("recentStores").innerHTML = S.recent.slice(0,6).map(s=>
    `<button onclick="pickStore('${esc(s)}')">${esc(s)}</button>`).join("");
}
function status(msg, spinning){ $("status").textContent = msg; $("loadSpin").style.display = spinning ? "" : "none"; }
$("storeInput").addEventListener("input", e=> $("storeGo").disabled = !e.target.value.trim());

/* ================= STORE ================= */
function pickStore(name){ $("storeInput").value = name; setStore(); }
function setStore(){
  const name = $("storeInput").value.trim(); if(!name) return;
  const known = S.stores.find(s=>s.name===name);
  S.store = name; S.newStore = null;
  if(known){ S.storeId = known.id; }
  else { S.storeId = uid('S'); S.newStore = {store_id:S.storeId, store:name};
         S.stores.push({id:S.storeId, name:name}); }
  S.recent = [name, ...S.recent.filter(s=>s!==name)].slice(0,8); ls.set("ps_recent", S.recent);
  $("storeChipName").textContent = name; $("storeChip").classList.remove("empty");
  $("storeScreen").classList.add("hidden"); $("captureScreen").classList.remove("hidden");
  resetItem(); $("codeInput").focus();
}
function showStore(){
  $("storeScreen").classList.remove("hidden"); $("captureScreen").classList.add("hidden");
  $("storeInput").value = S.store || ""; $("storeGo").disabled = !S.store;
}

/* ================= BARCODE ================= */
function lookup(code){
  code = (code || $("codeInput").value).trim();
  if(!code) return;
  stopCam();
  $("codeInput").value = code; S.code = code;
  const p = S.products[code];
  S.isNew = !p;
  $("hitCard").classList.toggle("hidden", !p);
  $("missCard").classList.toggle("hidden", !!p);
  if(p){
    $("hitBrand").textContent = p.brand; $("hitItem").textContent = p.item || code;
    $("hitSku").textContent = p.sku || "";
    const im = $("hitImg"); im.style.visibility = p.img ? "visible" : "hidden"; im.src = p.img || "";
  } else {
    $("newBrand").value=""; $("newItem").value=""; $("newSku").value=""; clearPhoto();
  }
  $("priceCard").classList.remove("hidden");
  setPrice("");
  document.querySelector('#priceCard .flags .on')?.classList.remove('on');
  document.querySelector('#priceCard .flags [data-f=normal]').classList.add('on'); S.flag = "normal";
  $("priceCard").scrollIntoView({behavior:"smooth", block:"nearest"});
}
function toggleCam(){
  if(S.camOn){ stopCam(); return; }
  if(typeof Html5Qrcode === "undefined"){ toast("โหลดตัวสแกนไม่สำเร็จ — พิมพ์เลขแทน", true); return; }
  $("reader").style.display = "block";
  S.cam = new Html5Qrcode("reader");
  S.cam.start({facingMode:"environment"}, {fps:10, qrbox:{width:250,height:120}},
    txt => lookup(txt), ()=>{})
   .then(()=>{ S.camOn = true; $("camBtn").style.background = "var(--warn)"; })
   .catch(()=>{ $("reader").style.display = "none"; toast("เปิดกล้องไม่ได้ — พิมพ์เลขแทน", true); });
}
function stopCam(){
  if(S.cam && S.camOn) S.cam.stop().catch(()=>{});
  S.camOn = false; $("reader").style.display = "none"; $("camBtn").style.background = "";
}

/* ================= PHOTO ================= */
function gotPhoto(inp){ shrink(inp.files[0], d=>{ S.photo = d; $("photoImg").src = d;
  $("photoThumb").classList.remove("hidden"); }); inp.value = ""; }
function clearPhoto(){ S.photo = null; $("photoThumb").classList.add("hidden"); }

/* ================= PRICE ================= */
function key(k){
  let p = S.price;
  if(k === "⌫") p = p.slice(0,-1);
  else if(k === "."){ if(!p.includes(".")) p = (p||"0") + "."; }
  else { if(p.replace(".","").length >= 6) return; p += k; }
  setPrice(p);
}
function setPrice(p){
  S.price = p;
  $("amt").textContent = p || "0"; $("amt").classList.toggle("empty", !p);
  $("saveBtn").disabled = !(parseFloat(p) > 0);
}
function setFlag(btn){
  btn.parentElement.querySelectorAll(".chip-btn").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on"); S.flag = btn.dataset.f;
}

/* ================= SAVE ================= */
function saveObs(){
  const price = parseFloat(S.price); if(!(price > 0)) return;
  const rec = { type:"obs", obs_id:uid('O'), ts:new Date().toISOString(),
    store_id:S.storeId, barcode:S.code, price:price, flag:S.flag, source:"scan", by:DEVICE };
  if(S.newStore){ rec.new_store = S.newStore; S.newStore = null; }
  if(S.isNew){
    const np = { brand:$("newBrand").value.trim(), item:$("newItem").value.trim(),
                 sku:$("newSku").value.trim(), photo:S.photo || null };
    rec.new_product = np;
    S.products[S.code] = { brand:np.brand, item:np.item, sku:np.sku, img:"" };
  }
  send(rec);
  S.count++;
  $("sessionCount").innerHTML = `รอบนี้ <b>${S.count}</b> รายการ`;
  toast(`บันทึกแล้ว · ฿${price}`);
  resetItem(); $("codeInput").focus();
}
function resetItem(){
  S.code = null; S.isNew = false; S.photo = null; setPrice("");
  $("codeInput").value = "";
  ["hitCard","missCard","priceCard"].forEach(id=>$(id).classList.add("hidden"));
  clearPhoto();
}

/* ================= SYNC ================= */
function send(rec){
  if(!API_URL) return;
  fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(rec)})
    .then(r=>r.json()).then(d=>{ if(!d.ok) throw 0; })
    .catch(()=>{ S.queue.push(rec); ls.set("ps_queue", S.queue);
      toast("ออฟไลน์ — เก็บไว้ส่งทีหลัง", true); });
}
async function flushQueue(){
  if(!API_URL || !S.queue.length) return;
  const q = [...S.queue]; S.queue = [];
  for(const rec of q){
    try{ const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(rec)});
      const d = await r.json(); if(!d.ok) throw 0; }
    catch(e){ S.queue.push(rec); }
  }
  ls.set("ps_queue", S.queue);
  if(q.length && !S.queue.length) toast("ส่งข้อมูลที่ค้างครบแล้ว");
}
window.addEventListener("online", flushQueue);

/* ================= UTIL ================= */
function shrink(file, cb, max=800){
  if(!file) return;
  const img = new Image(), rd = new FileReader();
  rd.onload = e => { img.onload = () => {
    const sc = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = img.width*sc; c.height = img.height*sc;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL("image/jpeg", .72));
  }; img.src = e.target.result; };
  rd.readAsDataURL(file);
}
function esc(s){ return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
let toastT;
function toast(msg, err){
  const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2200);
}
init();
</script>
</body>
</html>
