<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17191C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Price Scout">
<title>Price Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF9F6; --card:#FFFFFF; --ink:#17191C; --mut:#6E6A61;
  --line:#E6E2D9; --tag:#FF7A1A; --tag-deep:#E05E00; --tag-ink:#3A1A00;
  --ok:#0E8A5F; --ok-bg:#EAF6F0; --warn:#C7462B; --amber:#B07100; --amber-bg:#FBF3E0;
  --r:14px; --shadow:0 1px 2px rgba(23,25,28,.06),0 6px 18px rgba(23,25,28,.07);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--paper); color:var(--ink);
  font-family:'Noto Sans Thai',system-ui,sans-serif; font-size:16px}
body{max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
button{font-family:inherit; border:none; cursor:pointer; background:none; color:inherit}
input{font-family:inherit}

header{position:sticky; top:0; z-index:20; background:var(--paper);
  border-bottom:1px solid var(--line); padding:10px 14px; display:flex; align-items:center; gap:10px}
.logo{font-weight:800; font-size:15px; letter-spacing:.2px}
.logo small{display:block; font-weight:500; color:var(--mut); font-size:11px; letter-spacing:.4px}
.store-chip{margin-left:auto; display:flex; align-items:center; gap:7px; background:var(--ink);
  color:#fff; border-radius:99px; padding:8px 14px; font-weight:600; font-size:14px;
  max-width:55%; box-shadow:var(--shadow)}
.store-chip .dot{width:7px; height:7px; border-radius:99px; background:var(--tag); flex:none}
.store-chip span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.store-chip.empty{background:var(--warn)}

main{flex:1; padding:12px; display:flex; flex-direction:column; gap:10px; padding-bottom:112px}

/* Everything needed to record one price lives above the fold: barcode, product, tag,
   flags, keypad, save. In a shop, scrolling to reach the save button is the wrong cost.
   Chrome = header 48 + status 29 + tabs 58 + main padding 24. */
#fold{display:flex; flex-direction:column; gap:8px; min-height:calc(100dvh - 159px)}
#fold .card{padding:10px 12px}
#fold .pad{flex:1; align-content:stretch}
#fold .pad button{padding:0; min-height:44px}

/* The viewfinder is large while hunting for a barcode and shrinks to a strip once an item
   is up, so the keypad and save button stay above the fold while the price is typed.
   A phone cannot show a full viewfinder AND a full keypad at once; this is the trade. */
#reader, #qReader{border-radius:12px; overflow:hidden; background:#000; margin-top:8px;
  height:190px; transition:height .18s ease}
#captureScreen.has-item #reader{height:84px}
#reader video, #qReader video{width:100%!important; height:100%!important; object-fit:cover}
#reader img[alt="Info icon"], #reader__dashboard,
#qReader img[alt="Info icon"], #qReader__dashboard{display:none!important}
.scan-btn.on{background:var(--warn)}
.torch{position:absolute; top:8px; right:8px; z-index:5; background:rgba(23,25,28,.72);
  color:#fff; border-radius:99px; width:38px; height:38px; font-size:17px; display:grid;
  place-items:center}
.torch.on{background:var(--tag); color:var(--tag-ink)}
.readerwrap{position:relative}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:14px}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:1px; color:var(--mut);
  text-transform:uppercase; margin-bottom:8px}
.tin{width:100%; padding:13px; font-size:16px; font-weight:600; border:1.5px solid var(--line);
  border-radius:11px; background:var(--paper)}
.tin:focus{outline:none; border-color:var(--ink)}
.recent-stores{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.recent-stores button{background:var(--paper); border:1px solid var(--line); border-radius:99px;
  padding:8px 14px; font-size:14px; font-weight:600}

/* real dropdown — <datalist> is inconsistent on mobile and cannot be styled */
.combo{position:relative}
.combo-list{position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:40;
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); max-height:250px; overflow-y:auto}
.combo-list button{display:block; width:100%; text-align:left; padding:12px 14px;
  font-size:15px; font-weight:600; border-bottom:1px solid var(--line)}
.combo-list button:last-child{border-bottom:none}
.combo-list button:active{background:var(--paper)}
.combo-list .meta{display:block; font-size:12px; font-weight:500; color:var(--mut); margin-top:2px}
.combo-list .new{color:var(--tag-deep)}
.big-btn{width:100%; padding:15px; border-radius:12px; font-size:17px; font-weight:700;
  background:var(--ink); color:#fff; margin-top:14px}
#fold .big-btn{margin-top:8px; padding:13px}
.big-btn:disabled{opacity:.35}
.big-btn.tag{background:var(--tag); color:var(--tag-ink)}
.big-btn:active{transform:scale(.985)}

/* ---- capture ---- */
.code-row{display:flex; gap:8px}
.code-row input{flex:1; padding:11px 12px; font-size:19px; letter-spacing:1px; min-width:0;
  border:1.5px solid var(--line); border-radius:12px; background:var(--paper);
  font-family:'IBM Plex Mono',monospace; font-weight:600}
.code-row input:focus{outline:none; border-color:var(--ink)}
.scan-btn{flex:none; width:52px; border-radius:12px; background:var(--ink); color:#fff;
  font-size:22px; display:grid; place-items:center}

.hit{border-left:5px solid var(--ok); background:var(--ok-bg); display:flex; gap:12px; align-items:flex-start}
.hit img{width:52px; height:52px; object-fit:cover; border-radius:10px; background:#fff;
  border:1px solid var(--line); flex:none}
.hit .brand{font-size:12px; font-weight:700; color:var(--ok); letter-spacing:.5px; text-transform:uppercase}
.hit .name{font-size:15.5px; font-weight:700; line-height:1.2}
.hit .sku{font-size:13.5px; color:var(--mut); font-weight:600}
.hit .size{font-size:12.5px; color:var(--mut); font-family:'IBM Plex Mono',monospace}

.prices{margin-top:10px; border-top:1px solid var(--line); padding-top:9px}
.prices .row{display:flex; align-items:baseline; gap:8px; padding:4px 0; font-size:13.5px}
.prices .row .st{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prices .row .dt{color:var(--mut); font-size:11.5px; font-family:'IBM Plex Mono',monospace}
.prices .row .pr{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-weight:700}
.prices .row.promo .pr{color:var(--amber)}
.prices .row.short_shelf_life .pr{color:var(--warn)}
.prices .none{font-size:13px; color:var(--mut)}

.miss{border-left:5px solid var(--amber); background:var(--amber-bg)}
.miss .headline{font-weight:700; color:var(--amber); font-size:15px; margin-bottom:4px}
.miss .sub{font-size:12.5px; color:var(--mut); margin-bottom:10px}
.miss .tin{background:#fff; margin-top:8px; font-size:15px; padding:11px}
.miss-actions{display:flex; gap:8px; margin-top:10px}
.miss-actions button{flex:1; padding:11px; border-radius:10px; font-weight:700; font-size:14px;
  border:1.5px solid var(--line); background:#fff}
.miss-actions .keep{background:var(--ink); color:#fff; border-color:var(--ink)}

.chip-btn{padding:11px; border-radius:10px; border:1.5px solid var(--line); background:#fff;
  font-weight:600; font-size:14px}
.photo-thumb{margin-top:10px; display:flex; align-items:center; gap:10px}
.photo-thumb img{width:52px; height:52px; object-fit:cover; border-radius:8px; border:1px solid var(--line)}
.photo-thumb .rm{color:var(--warn); font-weight:700; font-size:13px}

.tag-wrap{display:flex; justify-content:center; padding:0}
.price-tag{position:relative; background:var(--tag); color:var(--tag-ink); border-radius:10px;
  padding:6px 26px 8px; min-width:190px; text-align:center;
  box-shadow:0 3px 0 var(--tag-deep), var(--shadow)}
.price-tag::before{content:""; position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:9px; height:9px; border-radius:99px; background:var(--paper);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.price-tag .cur{font-size:14px; font-weight:700; vertical-align:top; margin-right:2px}
.price-tag .amt{font-family:'IBM Plex Mono',monospace; font-size:34px; font-weight:700; line-height:1.05}
.price-tag .amt.empty{opacity:.35}
.price-tag .lbl{font-size:10.5px; font-weight:700; letter-spacing:1.5px; opacity:.75; margin-top:2px}

.flags{display:flex; gap:8px; margin:8px 0 0}
.flags .chip-btn{flex:1; font-size:13px; padding:9px 6px}
.flags .chip-btn.on{border-color:var(--ink); background:var(--ink); color:#fff}
.flags .chip-btn.on.exp{background:var(--warn); border-color:var(--warn)}
.flags .chip-btn.on.promo{background:var(--amber); border-color:var(--amber)}

.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:7px}
.pad button{padding:15px 0; font-size:23px; font-weight:600; background:var(--paper);
  border:1px solid var(--line); border-radius:12px; font-family:'IBM Plex Mono',monospace}
.pad button:active{background:var(--line)}
.pad .fn{font-size:19px; color:var(--mut)}

/* session log — one horizontal card per captured price */
#logList{display:flex; flex-direction:column; gap:8px}
.logcard{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:10px; display:flex; align-items:center; gap:10px}
.logcard img{width:46px; height:46px; object-fit:cover; border-radius:9px; flex:none;
  border:1px solid var(--line); background:var(--paper)}
.logcard .mid{min-width:0; flex:1}
.logcard .nm{font-size:14.5px; font-weight:700; line-height:1.2;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.logcard .sub{font-size:11.5px; color:var(--mut); font-family:'IBM Plex Mono',monospace;
  margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.logcard .amt2{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:17px; flex:none}
.logcard.promo .amt2{color:var(--amber)}
.logcard.short_shelf_life .amt2{color:var(--warn)}
.logcard .act{flex:none; min-width:64px; text-align:right}
.undo{background:var(--warn); color:#fff; border-radius:99px; padding:8px 12px;
  font-size:12.5px; font-weight:700; white-space:nowrap}
.sent{font-size:11.5px; font-weight:600; color:var(--mut)}
.sent.queued{color:var(--amber)}
#logBadge{position:absolute; transform:translate(16px,-9px); background:var(--tag);
  color:var(--tag-ink); border-radius:99px; font-size:10px; font-weight:800;
  padding:1px 5px; min-width:16px}
#logBadge:empty{display:none}
.tab{position:relative}

.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center}
.statgrid .lab{display:block; font-size:11px; font-weight:700; letter-spacing:.6px;
  color:var(--mut); text-transform:uppercase}
.statgrid .val{display:block; font-family:'IBM Plex Mono',monospace; font-weight:700;
  font-size:20px; margin-top:3px}
#qReader{height:190px}
.bar{height:5px; border-radius:99px; background:var(--line); margin-top:5px; overflow:hidden}
.bar span{display:block; height:100%; background:var(--tag); border-radius:99px}

.linkbtn{background:none; color:var(--mut); font-size:12.5px; font-weight:600;
  text-decoration:underline; padding:2px 0}

#toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:11px 20px; border-radius:99px; font-weight:600;
  font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:50; white-space:nowrap}
#toast.show{opacity:1; transform:translateX(-50%)}
#toast.err{background:var(--warn)}

/* status strip sits just above the tab bar */
#statusBar{position:fixed; bottom:58px; left:50%; transform:translateX(-50%); width:100%;
  max-width:480px; background:var(--card); border-top:1px solid var(--line);
  padding:6px 14px; z-index:29; display:flex; align-items:center; gap:8px;
  font-size:12px; color:var(--mut)}
#statusBar b{color:var(--ink)}
#statusBar.err{background:#FDF0ED; color:var(--warn)}

/* two jobs, two tabs */
footer{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  background:var(--card); border-top:1px solid var(--line); z-index:30;
  display:flex; padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1; padding:9px 4px 10px; display:flex; flex-direction:column; align-items:center;
  gap:3px; font-size:11.5px; font-weight:700; color:var(--mut); border-top:2.5px solid transparent}
.tab .ic{font-size:19px; line-height:1}
.tab.on{color:var(--ink); border-top-color:var(--tag)}
.spin{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--tag);
  border-radius:99px; animation:sp 1s linear infinite; flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo">PRICE SCOUT <small>เก็บราคาคู่แข่ง</small></div>
  <button class="store-chip empty" id="storeChip">
    <span class="dot"></span><span id="storeChipName">เลือกร้าน</span>
  </button>
</header>

<main>
  <section id="storeScreen" class="card">
    <div class="eyebrow">ร้านที่กำลังสำรวจ · Store</div>
    <div class="combo">
      <input type="text" id="storeInput" class="tin" placeholder="พิมพ์ชื่อร้าน…"
             autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="combo-list hidden" id="storeDrop"></div>
    </div>
    <div class="recent-stores" id="recentStores"></div>
    <button class="big-btn" id="storeGo" disabled>เริ่มเก็บราคา →</button>
  </section>

  <section id="captureScreen" class="hidden">
   <div id="fold">

    <div class="card">
      <div class="eyebrow">บาร์โค้ด · Barcode</div>
      <div class="code-row">
        <input type="text" id="codeInput" inputmode="numeric" enterkeyhint="search"
               placeholder="สแกน หรือพิมพ์เลข…" autocomplete="off">
        <button class="scan-btn" id="camBtn" title="เปิดกล้อง">▣</button>
      </div>
      <div class="readerwrap hidden" id="readerWrap">
        <div id="reader"></div>
        <button class="torch hidden" id="torchBtn" title="ไฟฉาย">☀</button>
      </div>
    </div>

    <div class="card hit hidden" id="hitCard">
      <img id="hitImg" alt="" onerror="this.style.visibility='hidden'">
      <div style="min-width:0;flex:1">
        <div class="brand" id="hitBrand"></div>
        <div class="name" id="hitItem"></div>
        <div class="sku" id="hitSku"></div>
        <div class="size" id="hitSize"></div>
      </div>
    </div>

    <div class="card miss hidden" id="missCard">
      <div class="headline">ไม่พบสินค้านี้ในระบบ</div>
      <div class="sub" id="missCode"></div>
      <div id="missForm" class="hidden">
        <input type="text" id="newItem" class="tin" placeholder="ชื่อสินค้า (ไม่ใส่ก็ได้)">
        <button class="chip-btn" id="photoBtn" style="width:100%;margin-top:8px">📷 ถ่ายรูปสินค้า</button>
        <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden">
        <div class="photo-thumb hidden" id="photoThumb">
          <img id="photoImg" alt=""><button class="rm" id="photoRm">ลบรูป</button>
        </div>
        <div class="sub" style="margin:8px 0 0">ใส่แค่ราคาก็บันทึกได้ — แอดมินจะเติมรายละเอียดให้ทีหลัง</div>
      </div>
      <div class="miss-actions" id="missActions">
        <button id="missDiscard">ทิ้งไป</button>
        <button class="keep" id="missKeep">บันทึกราคาต่อ</button>
      </div>
    </div>

    <div class="card hidden" id="priceCard">
      <div class="tag-wrap">
        <div class="price-tag">
          <span class="cur">฿</span><span class="amt empty" id="amt">0</span>
          <div class="lbl">ราคาขายปลีกที่เห็น</div>
        </div>
      </div>
      <div class="flags" id="flagRow">
        <button class="chip-btn on" data-f="normal">ปกติ</button>
        <button class="chip-btn exp" data-f="short_shelf_life">ใกล้หมดอายุ</button>
        <button class="chip-btn promo" data-f="promo">โปรฯ</button>
      </div>
      <div class="pad" id="pad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="fn" data-k=".">·</button><button data-k="0">0</button>
        <button class="fn" data-k="back">⌫</button>
      </div>
      <button class="big-btn tag" id="saveBtn" disabled>บันทึกราคา</button>
    </div>

   </div><!-- /fold -->

  </section>

  <section id="logScreen" class="hidden">
    <div class="card" id="logEmpty">
      <div style="color:var(--mut);font-size:14px">ยังไม่มีรายการในรอบนี้</div>
    </div>
    <div id="logList"></div>
  </section>

  <section id="searchScreen" class="hidden">

    <div class="card">
      <div class="eyebrow">สแกนหรือพิมพ์บาร์โค้ด</div>
      <div class="code-row">
        <input type="text" id="qCode" inputmode="numeric" enterkeyhint="search"
               placeholder="สแกน หรือพิมพ์เลข…" autocomplete="off">
        <button class="scan-btn" id="qCamBtn" title="เปิดกล้อง">▣</button>
      </div>
      <div class="readerwrap hidden" id="qReaderWrap">
        <div id="qReader"></div>
      </div>
    </div>

    <div class="card hit hidden" id="qHit">
      <img id="qImg" alt="" onerror="this.style.visibility='hidden'">
      <div style="min-width:0;flex:1">
        <div class="brand" id="qBrand"></div>
        <div class="name" id="qItem"></div>
        <div class="sku" id="qSku"></div>
        <div class="size" id="qSize"></div>
      </div>
    </div>

    <div class="card hidden" id="qStats">
      <div class="statgrid">
        <div><span class="lab">ต่ำสุด</span><span class="val" id="qMin">—</span></div>
        <div><span class="lab">กลาง</span><span class="val" id="qMed">—</span></div>
        <div><span class="lab">สูงสุด</span><span class="val" id="qMax">—</span></div>
      </div>
    </div>

    <div class="card hidden" id="qPricesCard">
      <div class="eyebrow">ราคาแต่ละร้าน · By store</div>
      <div class="prices" id="qPrices"></div>
    </div>

    <div class="card hidden" id="qEmpty">
      <div style="color:var(--mut);font-size:14px" id="qEmptyMsg"></div>
    </div>

  </section>
</main>

<div id="statusBar">
  <div class="spin hidden" id="loadSpin"></div>
  <div id="status">พร้อมใช้งาน</div>
  <div style="margin-left:auto" id="sessionCount"></div>
</div>

<footer>
  <button class="tab on" id="tabCapture"><span class="ic">▣</span>เก็บราคา</button>
  <button class="tab" id="tabSearch"><span class="ic">⌕</span>ค้นหาราคา</button>
  <button class="tab" id="tabLog"><span class="ic">☰</span>รายการ<span id="logBadge"></span></button>
</footer>

<div id="toast"></div>

<script type="module">
import { makeId, normBarcode, priceKey, priceValue, buildObs, shouldAcceptScan, rankStores,
         outboxAdd, outboxUndo, outboxDue, outboxMark, outboxRemove,
         outboxPending, UNDO_MS } from "./core.js";

/* ================= CONFIG ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbz0PQVtM46QOMu7aWOKV56Q-A3R6Fp45V42sBslG1AhZfQ_S3RyQGOg1Zp5toMgQtyaGg/exec";
const DEVICE = "Ooa";        // who holds this phone; becomes entered_by
const NET_TIMEOUT = 12000;

/* ================= STATE ================= */
const S = { store:null, storeId:null, newStore:null, stores:[], recent:[],
            tab:"capture", cdn:"", code:null, product:null, isNew:false, photo:null,
            price:"", flag:"normal", count:0 };

const $ = id => document.getElementById(id);
const esc = v => String(v).replace(/[&<>"\']/g, m =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "\'":"&#39;" }[m]));

/* ---- localStorage, always guarded: a full quota must never break the app ---- */
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch(e) { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch(e) {} }
};

/**
 * Every network call goes through here. No request may hang the UI: a stalled fetch in a
 * shop with one bar of signal is indistinguishable from a broken app, and the previous
 * version had exactly that failure — an unresolved promise left the page on a loading
 * message with no error and no way forward.
 */
async function api(path, opts = {}, timeout = NET_TIMEOUT) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeout);
  try {
    const res = await fetch(API_URL + path, { ...opts, signal: ctl.signal });
    return await res.json();
  } catch (e) {
    return { ok: false, offline: true };
  } finally {
    clearTimeout(timer);
  }
}

function setStatus(msg, spinning, isErr){
  $('status').textContent = msg;
  $('loadSpin').classList.toggle('hidden', !spinning);
  $('statusBar').classList.toggle('err', !!isErr);
}
let toastT;
function toast(msg, err){
  const t = $('toast');
  t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ================= PRODUCT LOOKUP =================
   The catalog is not downloaded. One barcode is resolved per scan, and the request runs
   while the price is being typed, so its latency sits inside a gap the user was already
   filling rather than in front of them. */
const lookupCache = new Map();          // session-local; a rescan is instant

async function lookupBarcode(code){
  const key = normBarcode(code);
  if (lookupCache.has(key)) return lookupCache.get(key);
  const d = await api(`?action=lookup&barcode=${encodeURIComponent(code)}`);
  if (!d.ok) return { pending: true };   // offline: unknown, not "new"
  if (d.cdn) S.cdn = d.cdn;
  lookupCache.set(key, d);               // keep the WHOLE payload — cdn included
  return d;
}

/** Prices are a separate request so identity is not held up behind a 45k-row scan. */
async function pricesFor(code){
  const d = await api(`?action=prices&barcode=${encodeURIComponent(code)}`, {}, 25000);
  return (d.ok && Array.isArray(d.prices)) ? d.prices : null;
}

/* ================= STORES ================= */
function renderStoreDrop(){
  const raw = $('storeInput').value.trim();
  const q = raw.toLowerCase();
  const box = $('storeDrop');
  const hits = rankStores(S.stores, raw, 8);
  const exact = S.stores.some(s => s.name.trim().toLowerCase() === q);

  box.innerHTML = '';
  if (!S.stores.length) {
    const d = document.createElement('div');
    d.style.cssText = 'padding:12px 14px;font-size:13.5px;color:var(--mut)';
    d.textContent = storesLoading ? 'กำลังโหลดรายชื่อร้าน…' : 'ยังไม่มีรายชื่อร้าน — พิมพ์ชื่อเพื่อเพิ่มใหม่';
    box.appendChild(d);
  }
  hits.forEach(s => {
    const b = document.createElement('button');
    b.innerHTML = `${esc(s.name)}` +
      (s.channel || s.region ? `<span class="meta">${esc([s.region, s.channel].filter(Boolean).join(' · '))}</span>` : '');
    b.addEventListener('click', () => pickStore(s.name, s.id));
    box.appendChild(b);
  });
  if (q && !exact) {
    const b = document.createElement('button');
    b.innerHTML = `<span class="new">+ เพิ่มร้านใหม่ “${esc($('storeInput').value.trim())}”</span>`;
    b.addEventListener('click', createStore);
    box.appendChild(b);
  }
  box.classList.toggle('hidden', box.childElementCount === 0);
}

function pickStore(name, id){
  $('storeDrop').classList.add('hidden');
  applyStore(name, id);
}

function createStore(){
  const name = $('storeInput').value.trim();
  if (!name) return;
  const known = S.stores.find(s =>
    s.name.trim().toLowerCase().replace(/\s+/g, ' ') === name.toLowerCase().replace(/\s+/g, ' '));
  if (known) { pickStore(known.name, known.id); return; }
  const id = makeId('S');
  S.stores.push({ id, name, region:'', channel:'' });
  S.newStore = { store_id: id, store: name };   // travels with the next observation
  pickStore(name, id);
}

function applyStore(name, id){
  S.store = name; S.storeId = id;
  ls.set('ps_store', { name, id });             // survives a reload — the lite version did not
  S.recent = [name, ...S.recent.filter(s => s !== name)].slice(0, 8);
  ls.set('ps_recent', S.recent);
  renderRecent();
  $('storeChipName').textContent = name;
  $('storeChip').classList.remove('empty');
  showTab(S.tab);
}

function renderRecent(){
  const box = $('recentStores');
  box.innerHTML = '';
  S.recent.slice(0, 6).forEach(name => {
    const b = document.createElement('button');
    b.textContent = name;
    b.addEventListener('click', () => {
      const hit = S.stores.find(s => s.name === name);
      hit ? pickStore(hit.name, hit.id) : ($('storeInput').value = name, createStore());
    });
    box.appendChild(b);
  });
}

/** Refresh the store list in the background. Cached copy renders first; failure is silent. */
let storesLoading = false;
async function refreshStores(){
  const cached = ls.get('ps_stores', null);
  if (cached && cached.length) S.stores = cached;
  storesLoading = true;
  if (!$('storeDrop').classList.contains('hidden')) renderStoreDrop();
  const d = await api('?action=stores');
  storesLoading = false;
  if (!d.ok || !Array.isArray(d.s)) { renderStoreDrop(); return; }
  S.stores = d.s.map(r => ({ id:r[0], name:r[1], region:r[2], channel:r[3] }));
  ls.set('ps_stores', S.stores);
  renderStoreDrop();
}

/* ================= CAPTURE ================= */
const FLAG_TH = { normal:"ปกติ", promo:"โปรฯ", short_shelf_life:"ใกล้หมดอายุ" };
const fmtPrice = n => "฿" + (n % 1 ? n.toFixed(2) : n.toLocaleString());

/** A barcode arrived — by typing, by Enter, or from the camera. */
async function onScan(raw){
  const code = String(raw || "").trim();
  if (!code) return;

  resetItem(false);
  S.code = code;
  $('codeInput').value = code;

  // The price card opens IMMEDIATELY. The lookup runs behind it, so the keypad is
  // never waiting on the network — that round trip lands in the gap while you type.
  $('captureScreen').classList.add('has-item');   // shrink the viewfinder, keep the keypad up
  $('priceCard').classList.remove('hidden');
  $('hitCard').classList.remove('hidden');
  $('hitBrand').textContent = '';
  $('hitItem').textContent = 'กำลังค้นหา…';
  $('hitSku').textContent = ''; $('hitSize').textContent = '';
  $('hitImg').style.visibility = 'hidden';
  $('codeInput').blur();

  // Capture asks ONLY for identity. Other shops' prices belong on ค้นหาราคา — fetching them
  // here would scan a second sheet on every save and slow the loop that has to be fastest.
  const res = await lookupBarcode(code);
  if (S.code !== code) return;                    // a newer scan overtook this one

  if (res.pending) { showUnresolved(code); return; }
  if (res.found)   { showHit(res); return; }
  showMiss(code);
}

function showHit(res){
  const p = res.p;
  S.product = p; S.isNew = false;
  S.code = p.barcode;                             // adopt the catalog's canonical barcode
  $('missCard').classList.add('hidden');
  $('hitCard').classList.remove('hidden');
  $('hitBrand').textContent = p.brand || '';
  $('hitItem').textContent = p.item || p.barcode;
  $('hitSku').textContent = p.sku || '';
  $('hitSize').textContent = [p.size, p.unit].filter(Boolean).join(' ');
  const img = p.img ? p.img.replace('~', res.cdn || '') : '';
  const el = $('hitImg');
  if (img) { el.src = img; el.style.visibility = 'visible'; } else { el.style.visibility = 'hidden'; }
}

function showMiss(code){
  S.product = null; S.isNew = true;
  $('hitCard').classList.add('hidden');
  $('missCard').classList.remove('hidden');
  $('missCode').textContent = code;
  $('missForm').classList.add('hidden');
  $('missActions').classList.remove('hidden');
}

/** Offline, or the lookup failed. Not the same as "new" — do not offer to create a product. */
function showUnresolved(code){
  S.product = null; S.isNew = true;
  $('hitCard').classList.remove('hidden');
  $('missCard').classList.add('hidden');
  $('hitBrand').textContent = '';
  $('hitItem').textContent = code;
  $('hitSku').textContent = 'ไม่มีสัญญาณ — บันทึกราคาได้ ระบบจะจับคู่สินค้าให้ภายหลัง';
  $('hitSize').textContent = '';
}

/* ---- price ---- */
function renderPrice(){
  $('amt').textContent = S.price || '0';
  $('amt').classList.toggle('empty', !S.price);
  $('saveBtn').disabled = priceValue(S.price) === null;
}
function key(k){ S.price = priceKey(S.price, k); renderPrice(); }

function setFlag(f){
  S.flag = f;
  $('flagRow').querySelectorAll('.chip-btn').forEach(b =>
    b.classList.toggle('on', b.dataset.f === f));
}

/** Clear the current item but keep the store, the tab and the camera as they are. */
function resetItem(clearCode = true){
  S.code = null; S.product = null; S.isNew = false; S.photo = null;
  S.price = ''; renderPrice(); setFlag('normal');
  if (clearCode) $('codeInput').value = '';
  $('captureScreen').classList.remove('has-item');
  ['hitCard','missCard','priceCard'].forEach(id => $(id).classList.add('hidden'));
  $('photoThumb').classList.add('hidden');
  $('newItem').value = '';
}

/* ================= CAMERA =================
   Modelled on the lite app, which is proven on this phone: html5-qrcode 2.3.8, fps 10, and a
   WIDE qrbox — an EAN-13 is a wide barcode and a square box finds it far less reliably.
   The one deliberate difference: the camera is NOT stopped when a code is found. The lite
   version called stopCam() on every hit and paid a cold start on the next item; here it runs
   continuously, so a shelf can be worked without touching the screen between products. */
let cam = null, camOn = false, lastScan = null, torchOn = false;

async function startCam(){
  if (camOn) return;
  if (typeof Html5Qrcode === 'undefined'){ toast('โหลดตัวสแกนไม่สำเร็จ — พิมพ์เลขแทน', true); return; }
  $('readerWrap').classList.remove('hidden');
  cam = new Html5Qrcode('reader', { verbose:false });
  try {
    await cam.start({ facingMode: 'environment' },
                    { fps: 10, qrbox: { width: 250, height: 120 } },
                    onDetected, () => {});
    camOn = true;
    $('camBtn').classList.add('on');
    ls.set('ps_cam', true);            // reopen automatically next time
    setTimeout(showTorchIfAvailable, 600);
  } catch (e) {
    $('readerWrap').classList.add('hidden');
    cam = null;
    toast('เปิดกล้องไม่ได้ — พิมพ์เลขแทน', true);
    $('codeInput').focus();
  }
}

async function stopCam(remember){
  if (cam && camOn) { try { await cam.stop() } catch(e) {} }
  try { if (cam) cam.clear() } catch(e) {}
  cam = null; camOn = false; torchOn = false;
  $('readerWrap').classList.add('hidden');
  $('camBtn').classList.remove('on');
  $('torchBtn').classList.add('hidden');
  $('torchBtn').classList.remove('on');
  if (remember) ls.set('ps_cam', false);
}

/** Every detection funnels through here, so de-duplication applies however a code arrives. */
function onDetected(text){
  const code = String(text || '').trim();
  if (!code) return;
  const now = Date.now();
  // A barcode sitting in the viewfinder fires continuously — one row per product, not per frame.
  if (!shouldAcceptScan(lastScan, code, now)) return;
  lastScan = { code, at: now };
  if (navigator.vibrate) navigator.vibrate(35);
  onScan(code);
}

function showTorchIfAvailable(){
  try {
    const caps = cam && cam.getRunningTrackCapabilities ? cam.getRunningTrackCapabilities() : null;
    if (caps && caps.torch) $('torchBtn').classList.remove('hidden');
  } catch (e) { /* no torch on this device */ }
}

async function toggleTorch(){
  if (!cam) return;
  try {
    torchOn = !torchOn;
    await cam.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
    $('torchBtn').classList.toggle('on', torchOn);
  } catch (e) { toast('เครื่องนี้เปิดไฟฉายไม่ได้', true); torchOn = false; }
}

// Release the camera when the app is backgrounded; bring it back on return.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (camOn) stopCam(false); }
  else if (S.storeId && S.tab === 'capture' && ls.get('ps_cam', false)) startCam();
});

/* ================= SAVE / OUTBOX =================
   A saved row is HELD locally for a few seconds before it is sent, so it can be undone —
   the API is append-only and has no delete. After the window it goes out; failures queue
   and retry. The backend recognises a repeated obs_id, so retrying can never duplicate. */
let OUTBOX = ls.get('ps_outbox', []);
const persistOutbox = () => ls.set('ps_outbox', OUTBOX);

function saveObservation(){
  const price = priceValue(S.price);
  if (price === null || !S.code || !S.storeId) return;

  const rec = buildObs({
    obsId: makeId('O'), ts: new Date().toISOString(), storeId: S.storeId,
    barcode: S.code, price, flag: S.flag, by: DEVICE,
    source: $('reader').classList.contains('hidden') ? 'manual' : 'scan',
    newStore: S.newStore || undefined,
    // Always sent. The backend creates a Products row ONLY when the barcode is genuinely
    // unknown, so an observation can never point at a product that does not exist.
    newProduct: { brand: "", item: $('newItem').value.trim(), sku: "", photo: S.photo || null }
  });
  S.newStore = null;

  OUTBOX = outboxAdd(OUTBOX, rec, Date.now());
  persistOutbox();
  S.count++;
  const nm = S.product ? [S.product.brand, S.product.item, S.product.sku].filter(Boolean).join(' ')
                       : ($('newItem').value.trim() || S.code);
  const im = S.product && S.product.img ? S.product.img.replace('~', S.cdn || '') : '';
  logAdd(rec, nm, im);
  renderPending();
  toast(`บันทึกแล้ว · ${fmtPrice(price)}`);
  resetItem();
  $('codeInput').focus();
}

function renderPending(){
  const n = outboxPending(OUTBOX);
  $('sessionCount').innerHTML =
    `รอบนี้ <b>${S.count}</b>` + (n ? ` · รอส่ง <b>${n}</b>` : '');
}

/** Everything due goes in ONE request — a shop's worth of rows is one round trip. */
let flushing = false;
async function flushOutbox(force){
  if (flushing) return;
  const due = force ? OUTBOX.filter(e => e.state !== 'sending') : outboxDue(OUTBOX, Date.now());
  if (!due.length) return;
  flushing = true;
  const ids = due.map(e => e.rec.obs_id);
  ids.forEach(id => { OUTBOX = outboxMark(OUTBOX, id, 'sending'); });
  persistOutbox();
  try {
    const d = await api('', { method:'POST', headers:{'Content-Type':'text/plain'},
                             body: JSON.stringify({ type:'batch', items: due.map(e => e.rec) }) }, 30000);
    if (!d.ok || !Array.isArray(d.results)) throw new Error('rejected');
    d.results.forEach(r => {
      // "duplicate" means a previous attempt DID land — the row is safely in the Sheet,
      // so it is done, not failed. This is what makes retrying over a bad signal safe.
      OUTBOX = (r.status === 'written' || r.status === 'duplicate')
        ? outboxRemove(OUTBOX, r.id) : outboxMark(OUTBOX, r.id, 'queued');
      if (r.store_id) { S.storeId = r.store_id; ls.set('ps_store', { name:S.store, id:r.store_id }); }
    });
  } catch (e) {
    ids.forEach(id => { OUTBOX = outboxMark(OUTBOX, id, 'queued'); });
  }
  flushing = false;
  persistOutbox(); renderPending(); renderLog();
}

setInterval(() => flushOutbox(false), 2000);
window.addEventListener('online', () => flushOutbox(true));
// Flushing when the page hides stops a held row being lost if the app is closed mid-window.
document.addEventListener('visibilitychange', () => { if (document.hidden) flushOutbox(true); });

/* ================= SEARCH (ค้นหาราคา) =================
   Same scanner, same de-duplication, different job: no keypad, no save. Point at a product
   and see what every shop charges. */
let qCam = null, qCamOn = false, qLast = null, qCode = null;

async function qStartCam(){
  if (qCamOn) return;
  if (typeof Html5Qrcode === 'undefined'){ toast('โหลดตัวสแกนไม่สำเร็จ — พิมพ์เลขแทน', true); return; }
  $('qReaderWrap').classList.remove('hidden');
  qCam = new Html5Qrcode('qReader', { verbose:false });
  try {
    await qCam.start({ facingMode:'environment' },
                     { fps:10, qrbox:{ width:250, height:120 } },
                     txt => {
                       const code = String(txt || '').trim();
                       if (!code) return;
                       const now = Date.now();
                       if (!shouldAcceptScan(qLast, code, now)) return;
                       qLast = { code, at: now };
                       if (navigator.vibrate) navigator.vibrate(35);
                       qLookup(code);
                     }, () => {});
    qCamOn = true; $('qCamBtn').classList.add('on');
  } catch (e) {
    $('qReaderWrap').classList.add('hidden'); qCam = null;
    toast('เปิดกล้องไม่ได้ — พิมพ์เลขแทน', true);
  }
}

async function qStopCam(){
  if (qCam && qCamOn) { try { await qCam.stop() } catch(e) {} }
  try { if (qCam) qCam.clear() } catch(e) {}
  qCam = null; qCamOn = false;
  $('qReaderWrap').classList.add('hidden');
  $('qCamBtn').classList.remove('on');
}

const median = a => {
  const v = [...a].sort((x, y) => x - y), m = v.length >> 1;
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
};

async function qLookup(code){
  code = String(code || '').trim();
  if (!code) return;
  qCode = code;
  $('qCode').value = code;
  $('qCode').blur();

  $('qHit').classList.remove('hidden');
  $('qBrand').textContent = ''; $('qItem').textContent = 'กำลังค้นหา…';
  $('qSku').textContent = ''; $('qSize').textContent = '';
  $('qImg').style.visibility = 'hidden';
  ['qStats','qPricesCard','qEmpty'].forEach(id => $(id).classList.add('hidden'));

  const [res, list] = await Promise.all([lookupBarcode(code), pricesFor(code)]);
  if (qCode !== code) return;

  if (res.pending) {
    $('qItem').textContent = code;
    $('qSku').textContent = 'ไม่มีสัญญาณ — ลองใหม่เมื่อเชื่อมต่อได้';
    return;
  }
  if (!res.found) {
    $('qHit').classList.add('hidden');
    $('qEmpty').classList.remove('hidden');
    $('qEmptyMsg').textContent = `ไม่พบสินค้าบาร์โค้ด ${code} ในระบบ`;
    return;
  }

  const p = res.p;
  $('qBrand').textContent = p.brand || '';
  $('qItem').textContent = p.item || p.barcode;
  $('qSku').textContent = p.sku || '';
  $('qSize').textContent = [p.size, p.unit].filter(Boolean).join(' ');
  const img = p.img ? p.img.replace('~', res.cdn || '') : '';
  const el = $('qImg');
  if (img) { el.src = img; el.style.visibility = 'visible'; } else { el.style.visibility = 'hidden'; }

  const prices = list || [];
  if (!prices.length) {
    $('qEmpty').classList.remove('hidden');
    $('qEmptyMsg').textContent = 'ยังไม่มีใครเก็บราคาสินค้านี้';
    return;
  }

  // Stats use ปกติ prices only — a promo price is not the shelf price.
  const normal = prices.filter(r => r.flag === 'normal').map(r => r.price);
  if (normal.length) {
    $('qStats').classList.remove('hidden');
    $('qMin').textContent = fmtPrice(Math.min(...normal));
    $('qMed').textContent = fmtPrice(median(normal));
    $('qMax').textContent = fmtPrice(Math.max(...normal));
  }

  const lo = Math.min(...prices.map(r => r.price));
  const hi = Math.max(...prices.map(r => r.price));
  $('qPricesCard').classList.remove('hidden');
  $('qPrices').innerHTML = prices.map(r => {
    const pct = hi > lo ? Math.round(((r.price - lo) / (hi - lo)) * 100) : 100;
    return `<div class="row ${esc(r.flag)}">
        <span class="st">${esc(r.store)}${r.channel ? ' · ' + esc(r.channel) : ''}</span>
        <span class="dt">${esc(r.date)}${r.flag !== 'normal' ? ' · ' + esc(FLAG_TH[r.flag] || r.flag) : ''}</span>
        <span class="pr">${esc(fmtPrice(r.price))}</span>
      </div>
      <div class="bar"><span style="width:${Math.max(pct, 4)}%"></span></div>`;
  }).join('');
}

/* ================= SESSION LOG =================
   Everything captured this trip, newest first. A row can be cancelled only while it is still
   held locally (UNDO_MS); once sent it is in the Sheet, and the API has no delete — saying
   otherwise would be a lie the user finds out about later. */
let SESSION = ls.get('ps_session', []);
const saveSession = () => ls.set('ps_session', SESSION.slice(0, 100));

function logAdd(rec, name, img){
  SESSION.unshift({ id: rec.obs_id, at: rec.ts, barcode: rec.barcode, name: name || rec.barcode,
                    img: img || '', price: rec.price, flag: rec.flag, store: S.store });
  SESSION = SESSION.slice(0, 100);
  saveSession(); renderLog();
}

const hhmm = iso => { const d = new Date(iso);
  return isNaN(d) ? '' : String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };

/** State of one logged row inside the outbox, if it is still there at all. */
function outboxState(id){
  const e = OUTBOX.find(x => x.rec.obs_id === id);
  return e ? e.state : 'sent';
}

function renderLog(){
  const list = $('logList');
  $('logEmpty').classList.toggle('hidden', SESSION.length > 0);
  const now = Date.now();
  list.innerHTML = SESSION.map(r => {
    const st = outboxState(r.id);
    const held = st === 'held';
    const left = held ? Math.max(0, Math.ceil((new Date(r.at).getTime() + UNDO_MS - now) / 1000)) : 0;
    const act = held
      ? `<button class="undo" data-undo="${esc(r.id)}">ยกเลิก ${left}</button>`
      : `<span class="sent${st === 'queued' ? ' queued' : ''}">${st === 'queued' ? 'รอส่ง' : st === 'sending' ? 'กำลังส่ง' : 'ส่งแล้ว'}</span>`;
    return `<div class="logcard ${esc(r.flag)}">
      ${r.img ? `<img src="${esc(r.img)}" alt="" onerror="this.style.visibility='hidden'">` : ''}
      <div class="mid">
        <div class="nm">${esc(r.name)}</div>
        <div class="sub">${esc(hhmm(r.at))} · ${esc(r.store || '')} · ${esc(r.barcode)}</div>
      </div>
      <div class="amt2">${esc(fmtPrice(r.price))}</div>
      <div class="act">${act}</div>
    </div>`;
  }).join('');

  const pending = OUTBOX.length;
  $('logBadge').textContent = pending ? String(pending) : '';
}

function undoEntry(id){
  const before = OUTBOX.length;
  OUTBOX = outboxUndo(OUTBOX, id);
  if (OUTBOX.length === before){
    toast('ส่งไปแล้ว — แก้ใน Sheet', true);   // honest: there is no delete endpoint
    renderLog(); return;
  }
  persistOutbox();
  SESSION = SESSION.filter(r => r.id !== id);
  saveSession();
  S.count = Math.max(0, S.count - 1);
  renderPending(); renderLog();
  toast('ยกเลิกรายการแล้ว');
}

$('logList').addEventListener('click', e => {
  const id = e.target.dataset && e.target.dataset.undo;
  if (id) undoEntry(id);
});

// Tick only while something is still cancellable, so the countdown stays honest.
setInterval(() => {
  if (S.tab === 'log' && OUTBOX.some(e => e.state === 'held')) renderLog();
}, 1000);

/* ================= TABS ================= */
function showTab(which){
  S.tab = which;
  // Two viewfinders cannot share one camera — release the other tab's before switching.
  if (which !== 'capture' && camOn) stopCam(false);
  if (which !== 'search' && qCamOn) qStopCam();
  const needsStore = !S.storeId && which === 'capture';
  $('storeScreen').classList.toggle('hidden', !needsStore);
  $('captureScreen').classList.toggle('hidden', needsStore || which !== 'capture');
  $('searchScreen').classList.toggle('hidden', which !== 'search');
  $('logScreen').classList.toggle('hidden', which !== 'log');
  if (which === 'log') renderLog();
  $('tabCapture').classList.toggle('on', which === 'capture');
  $('tabSearch').classList.toggle('on', which === 'search');
  $('tabLog').classList.toggle('on', which === 'log');
  // ค้นหาราคา is not scoped to a store — it reports every shop. Showing the capture store
  // in the header there would imply otherwise.
  $('storeChip').classList.toggle('hidden', which === 'search');
}

function showStorePicker(){
  $('storeScreen').classList.remove('hidden');
  $('captureScreen').classList.add('hidden');
  $('searchScreen').classList.add('hidden');
  $('storeInput').value = '';
  renderStoreDrop();
  $('storeInput').focus();
}

/* ================= WIRING ================= */
$('storeInput').addEventListener('input', renderStoreDrop);
$('storeInput').addEventListener('focus', renderStoreDrop);
$('storeInput').addEventListener('keydown', e => { if (e.key === 'Enter') createStore(); });
$('storeGo').addEventListener('click', createStore);
$('storeChip').addEventListener('click', showStorePicker);
// Tapping เก็บราคา while already on it clears the current item — a one-tap restart.
$('tabCapture').addEventListener('click', () => {
  if (S.tab === 'capture' && S.storeId) resetItem();
  showTab('capture');
});
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') onScan(e.target.value); });
$('pad').addEventListener('click', e => { const k = e.target.dataset.k; if (k) key(k); });
$('flagRow').addEventListener('click', e => { const f = e.target.dataset.f; if (f) setFlag(f); });
$('missKeep').addEventListener('click', () => {
  $('missForm').classList.remove('hidden');
  $('missActions').classList.add('hidden');
});
$('missDiscard').addEventListener('click', () => { resetItem(); $('codeInput').focus(); });
$('saveBtn').addEventListener('click', saveObservation);
$('camBtn').addEventListener('click', () => camOn ? stopCam(true) : startCam());
$('torchBtn').addEventListener('click', toggleTorch);

// Physical keyboard: the laptop is a real capture device too.
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (/^[0-9]$/.test(e.key)) key(e.key);
  else if (e.key === '.') key('.');
  else if (e.key === 'Backspace') key('back');
  else if (e.key === 'Enter' && priceValue(S.price) !== null) saveObservation();
});
$('tabSearch').addEventListener('click', () => showTab('search'));
$('tabLog').addEventListener('click', () => showTab('log'));
$('qCode').addEventListener('keydown', e => { if (e.key === 'Enter') qLookup(e.target.value); });
$('qCamBtn').addEventListener('click', () => qCamOn ? qStopCam() : qStartCam());
document.addEventListener('click', e => {
  if (!e.target.closest('.combo')) $('storeDrop').classList.add('hidden');
});

/* ================= INIT =================
   Nothing here is awaited before the app is usable. The page is interactive immediately;
   the store list arrives when the network allows, or not at all. */
function init(){
  S.recent = ls.get('ps_recent', []);
  S.stores = ls.get('ps_stores', []);
  renderRecent();

  const saved = ls.get('ps_store', null);
  if (saved && saved.name && saved.id) applyStore(saved.name, saved.id);
  else showTab('capture');

  setStatus('พร้อมใช้งาน');
  renderPending();
  renderLog();
  if (S.storeId && ls.get('ps_cam', false)) startCam();
  refreshStores();
  flushOutbox(true);
}
init();

// Registered on load, not at parse time, so it never competes with the app becoming
// interactive; failure is silent because a shop with no signal is exactly the case where
// this must not block or error the page — the app already works without it this one time.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
